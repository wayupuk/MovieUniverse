<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Search · Media Universe</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/fonts.css">
</head>
<body>
  <div id="site-header"></div>
  <main>
    <!-- Page 2: All Search -->
    <div class="page-head">
      <div>
        <h1>Search</h1>
        <p class="muted">Titles, synopsis, directors, actors, universes, genres, books and authors.</p>
      </div>
    </div>
    <form id="search-form" class="toolbar">
      <input id="q" name="q" type="search" placeholder="e.g. Harry Potter, Robert Downey, Rowling…" style="flex:1;min-width:220px">
      <select id="type" aria-label="Type">
        <option value="">Movies &amp; series</option>
        <option value="movie">Movies</option>
        <option value="series">Series</option>
      </select>
      <select id="genre" aria-label="Genre"></select>
      <button class="btn btn-primary">Search</button>
    </form>
    <p id="summary" class="muted"></p>
    <div id="results" class="grid"></div>
  </main>
  <script src="js/common.js"></script>
  <script src="js/search.js"></script>
</body>
</html>
