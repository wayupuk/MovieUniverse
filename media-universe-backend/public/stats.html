<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Statistics · Media Universe</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/stats.css">
</head>
<body>
  <div id="site-header"></div>
  <main>
    <!-- Page 10: Statistics (admin / developer) -->
    <div class="page-head">
      <div>
        <h1>Statistics</h1>
        <p class="muted">Admin and developer only.</p>
      </div>
    </div>
    <div id="tiles" class="tiles"></div>

    <div class="section panel">
      <div class="section-head visits-head">
        <div>
          <h3>Visits over time</h3>
          <p class="muted" id="visits-summary"></p>
        </div>
        <div class="toolbar" style="margin:0">
          <div class="segmented" id="visits-type" role="group" aria-label="Media type">
            <button type="button" class="active" data-type="all" aria-pressed="true">All</button>
            <button type="button" data-type="movie" aria-pressed="false">Movies</button>
            <button type="button" data-type="series" aria-pressed="false">Series</button>
          </div>
          <select id="visits-days" aria-label="Time period">
            <option value="7">Last 7 days</option>
            <option value="30" selected>Last 30 days</option>
            <option value="90">Last 90 days</option>
          </select>
        </div>
      </div>
      <div id="visits-body">
        <div id="visits-chart" class="line-chart"></div>
        <details class="chart-data">
          <summary>Show data as a table</summary>
          <div class="table-wrap"><table id="visits-table"></table></div>
        </details>
        <h3 class="visits-top-title">Most visited</h3>
        <div id="top-visited" class="bars"></div>
      </div>
    </div>

    <div class="section chart-grid">
      <div class="panel"><h3>Media per main genre</h3><div id="by-genre" class="bars"></div></div>
      <div class="panel"><h3>Media per universe</h3><div id="by-universe" class="bars"></div></div>
      <div class="panel"><h3>Most watchlisted</h3><div id="top-watch" class="bars"></div></div>
      <div class="panel"><h3>Top rated</h3><div id="top-rated" class="bars"></div></div>
    </div>

    <div class="section panel">
      <div class="section-head">
        <h3>Group and sort</h3>
        <div class="toolbar" style="margin:0">
          <label for="group-by" style="margin:0">Group by</label>
          <select id="group-by">
            <option value="genre">Main genre</option><option value="universe">Universe</option>
            <option value="category">Category</option><option value="country">Country</option>
            <option value="type">Type</option><option value="age_rating">Age rating</option>
            <option value="status">Status</option><option value="director">Director</option>
            <option value="year">Release year</option>
          </select>
          <label for="sort-by" style="margin:0">Sort by</label>
          <select id="sort-by">
            <option value="count">Media count</option><option value="avg_rating">Average rating</option>
            <option value="watchlist">Watchlist saves</option><option value="name">Name</option>
          </select>
        </div>
      </div>
      <div class="table-wrap"><table id="group-table"></table></div>
    </div>

    <div class="section panel">
      <div class="section-head">
        <h3>Accounts</h3>
        <span class="muted" id="accounts-note"></span>
      </div>
      <div class="table-wrap"><table id="accounts-table"></table></div>
    </div>
  </main>
  <script src="js/common.js"></script>
  <script src="js/stats.js"></script>
</body>
</html>
